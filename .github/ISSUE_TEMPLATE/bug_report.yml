name: 问题反馈
description: 报告可复现的功能或界面问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请先搜索已有问题。分享配置或截图前移除私人路径、网址和账号信息；安全问题请参考 SECURITY.md。"
  - type: input
    id: version
    attributes:
      label: dock_box 版本或提交号
      placeholder: "例如：1.0.0 / commit SHA"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本、缩放比例与显示器
      placeholder: "例如：Windows 11 24H2，150%，双显示器"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 运行方式
      options:
        - 安装版
        - 便携版
        - 源码开发模式
        - 浏览器预览
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 出现…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、错误信息和补充环境
      description: "请注明是否同时运行其他 Dock、任务栏或桌面美化工具。"
