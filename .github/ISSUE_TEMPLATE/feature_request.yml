name: 功能建议
description: 提供使用场景与期望行为
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景和当前遇到的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能或交互
      description: "可以提供示例或参考图，并说明它如何解决问题。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式与补充说明
